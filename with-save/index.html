<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>TextRPG — с сохранением</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1e2230;
  --line: #2a2f3d;
  --text: #e8eaf0;
  --muted: #98a0b3;
  --accent: #6ea8fe;
  --hp: #f0f2f7;
  --danger: #ff6b6b;
  --good: #7bd88f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #1b2030, var(--bg));
  color: var(--text);
  font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.card {
  max-width: 640px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.mode-tag {
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  white-space: nowrap;
}

#log {
  max-height: 52vh;
  overflow-y: auto;
  padding: 2px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.entry {
  position: relative;
  margin: 12px 0;
  padding: 12px 14px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 3px solid #39405280;
  border-radius: 12px;
}

.entry-good {
  border-left-color: var(--good);
}

.entry-bad {
  border-left-color: var(--danger);
}

.entry-info {
  border-left-color: var(--accent);
}

.entry + .entry::before {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  top: -7px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}

.entry-title {
  font-weight: 600;
}

.entry-desc {
  color: var(--muted);
  font-size: 14px;
}

.stats {
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  color: var(--muted);
}

.stats b {
  color: var(--text);
  font-weight: 600;
}

.warning {
  margin-top: 6px;
  font-size: 14px;
  color: var(--danger);
  font-weight: 600;
}

.hit {
  font-weight: 600;
}

.hit-you {
  color: var(--good);
}

.hit-enemy {
  color: var(--danger);
}

.bar {
  margin-top: 6px;
  height: 12px;
  background: #2b303c;
  border-radius: 999px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--hp);
  border-radius: 999px;
  transition: width 0.2s ease;
}

.actions {
  display: grid;
  gap: 10px;
  margin-top: 16px;
}

button {
  width: 100%;
  padding: 14px 16px;
  font: inherit;
  font-weight: 600;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
}

button:active {
  border-color: var(--accent);
}

button.primary {
  background: #24406e;
  border-color: #315694;
}

button.ghost {
  background: transparent;
  color: var(--muted);
}

input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 12px;
}

input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

.prompt {
  margin: 0 0 10px;
  font-weight: 600;
}
</style>
</head>
<body>
<main class="card">
  <div class="topbar">
    <strong>TextRPG</strong>
    <span class="mode-tag" id="mode-tag"></span>
  </div>
  <div id="log"></div>
  <div class="actions" id="actions"></div>
</main>
<script>
const MODE = "save";
const STORAGE_KEY = "textrpg-save";
const MAX_LEVEL = 50;

const CLASS_INFO = {
  "Воин": {
    description: "Крепкий боец ближнего боя с хорошей защитой.",
    maxHealth: 10,
    attack: 2,
    defense: 4,
  },
  "Лучник": {
    description: "Боец дальнего боя с высоким уроном.",
    maxHealth: 7,
    attack: 3,
    defense: 2,
  },
  "Маг": {
    description: "Наносит разрушительный урон заклинаниями, но практически беззащитен.",
    maxHealth: 5,
    attack: 4,
    defense: 1,
  },
};

const ENEMY_KINDS = [
  {
    name: "Лесная крыса",
    description: "Мелкий и слабый, но довольно быстрый зверь.",
    female: true,
    tier: 1,
    unlockLevel: 1,
    defenseShare: 0.15,
    hitsToKill: 2,
    hitsYouSurvive: 20,
  },
  {
    name: "Дикий волк",
    description: "Атакует стаей и быстро сокращает дистанцию.",
    female: false,
    tier: 2,
    unlockLevel: 2,
    defenseShare: 0.25,
    hitsToKill: 4,
    hitsYouSurvive: 22,
  },
  {
    name: "Лесной разбойник",
    description: "Опасный противник, способный дать отпор в бою.",
    female: false,
    tier: 3,
    unlockLevel: 3,
    defenseShare: 0.35,
    hitsToKill: 6,
    hitsYouSurvive: 30,
  },
  {
    name: "Бандит",
    description: "Крепкий противник с тяжёлым оружием.",
    female: false,
    tier: 4,
    unlockLevel: 5,
    defenseShare: 0.3,
    hitsToKill: 4,
    hitsYouSurvive: 14,
  },
  {
    name: "Лесной громила",
    description: "Медленный, но очень живучий противник.",
    female: false,
    tier: 5,
    unlockLevel: 7,
    defenseShare: 0.45,
    hitsToKill: 8,
    hitsYouSurvive: 32,
  },
];

const logBox = document.getElementById("log");
const actionsBox = document.getElementById("actions");
document.getElementById("mode-tag").textContent =
  MODE === "save" ? "с сохранением" : "без сохранения";

let save = null;
let hero = null;
let heroClass = null;
let enemy = null;
let lastHit = null;
let afterSkillPointTarget = null;

function expNeeded(level) {
  return Math.round(30 * Math.pow(level, 1.5));
}

function defaultClassData(className) {
  const base = CLASS_INFO[className];
  return {
    level: 1,
    experience: 0,
    skillPoints: 0,
    health: base.maxHealth,
    maxHealth: base.maxHealth,
    attack: base.attack,
    defense: base.defense,
    wins: 0,
  };
}

function newSave(playerName) {
  const classes = {};
  for (const className of Object.keys(CLASS_INFO)) {
    classes[className] = defaultClassData(className);
  }
  return { name: playerName, currentClass: null, classes };
}

function storeSave() {
  if (MODE !== "save") return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
  } catch (error) {
    // приватный режим браузера может запрещать запись — играем без сохранения
  }
}

function loadSave() {
  if (MODE !== "save") return null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function write(html, tone) {
  const entry = document.createElement("div");
  entry.className = tone ? "entry " + tone : "entry";
  entry.innerHTML = html;
  logBox.appendChild(entry);
  logBox.scrollTop = logBox.scrollHeight;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (char) => {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char];
  });
}

function bar(current, maximum) {
  const percent = maximum > 0 ? Math.max(0, (current / maximum) * 100) : 0;
  return `<div class="bar"><span style="width:${percent}%"></span></div>`;
}

function ask(prompt, options) {
  actionsBox.innerHTML = "";
  if (prompt) {
    const title = document.createElement("p");
    title.className = "prompt";
    title.textContent = prompt;
    actionsBox.appendChild(title);
  }
  options.forEach((option, index) => {
    const button = document.createElement("button");
    button.textContent = `${index + 1}. ${option.label}`;
    if (option.style) button.classList.add(option.style);
    button.onclick = option.action;
    actionsBox.appendChild(button);
  });
}

function askName() {
  actionsBox.innerHTML = "";
  const title = document.createElement("p");
  title.className = "prompt";
  title.textContent = "Как тебя зовут?";
  const field = document.createElement("input");
  field.type = "text";
  field.maxLength = 20;
  field.placeholder = "Имя героя";
  const button = document.createElement("button");
  button.className = "primary";
  button.textContent = "Продолжить";

  function submit() {
    const value = field.value.trim() || "Герой";
    save = newSave(value);
    storeSave();
    write(`Привет, ${escapeHtml(value)}!`);
    mainMenu();
  }

  button.onclick = submit;
  field.onkeydown = (event) => {
    if (event.key === "Enter") submit();
  };

  actionsBox.appendChild(title);
  actionsBox.appendChild(field);
  actionsBox.appendChild(button);
  field.focus();
}

function mainMenu() {
  const options = [];
  if (save.currentClass) {
    options.push({
      label: "Продолжить игру",
      style: "primary",
      action: () => {
        heroClass = save.currentClass;
        hero = save.classes[heroClass];
        characterMenu();
      },
    });
  }
  options.push({
    label: "Новая игра",
    style: save.currentClass ? null : "primary",
    action: () => {
      save = newSave(save.name);
      storeSave();
      write("Новая игра. Прогресс всех классов сброшен.");
      chooseClass();
    },
  });
  ask("Главное меню", options);
}

function chooseClass() {
  ask(
    "Выбери класс персонажа:",
    Object.keys(CLASS_INFO).map((className) => ({
      label: className,
      action: () => showClassSheet(className),
    }))
  );
}

function statsLine(data) {
  const levelText =
    data.level >= MAX_LEVEL
      ? `Уровень: <b>${data.level}</b> (максимум)`
      : `Уровень: <b>${data.level}</b> · Опыт: <b>${data.experience}</b> / ${expNeeded(data.level)}`;
  return (
    `<div class="stats">${levelText}<br>` +
    `Здоровье: <b>${data.health}</b> / ${data.maxHealth} · ` +
    `Атака: <b>${data.attack}</b> · Защита: <b>${data.defense}</b><br>` +
    `Побед: <b>${data.wins}</b></div>`
  );
}

function showClassSheet(className) {
  const data = save.classes[className];
  write(
    `<div class="entry-title">${className}</div>` +
      `<div class="entry-desc">${CLASS_INFO[className].description}</div>` +
      statsLine(data),
    "entry-info"
  );
  ask("Выбери действие:", [
    {
      label: "Подтвердить",
      style: "primary",
      action: () => {
        save.currentClass = className;
        heroClass = className;
        hero = data;
        storeSave();
        write(`${escapeHtml(save.name)}, ты выбрал класс: ${className}.`);
        enterForest();
      },
    },
    { label: "Назад", style: "ghost", action: chooseClass },
  ]);
}

function characterMenu() {
  if (hero.skillPoints > 0) {
    afterSkillPointTarget = characterMenu;
    spendSkillPoint();
    return;
  }
  storeSave();
  write(
    `<div class="entry-title">${heroClass}</div>` +
      `<div class="entry-desc">${CLASS_INFO[heroClass].description}</div>` +
      statsLine(hero),
    "entry-info"
  );
  ask("Выбери действие:", [
    { label: "Вернуться в локацию", style: "primary", action: enterForest },
    {
      label: "Главное меню",
      style: "ghost",
      action: () => {
        storeSave();
        mainMenu();
      },
    },
  ]);
}

function spendSkillPoint() {
  write('<div class="entry-title">Вы повысили уровень.</div>', "entry-info");
  ask("Какую характеристику вы желаете прокачать?", [
    {
      label: "Здоровье",
      action: () => {
        hero.maxHealth += 1;
        hero.health += 1;
        hero.skillPoints -= 1;
        write("Здоровье увеличено на 1.");
        afterSkillPoint();
      },
    },
    {
      label: "Атака",
      action: () => {
        hero.attack += 1;
        hero.skillPoints -= 1;
        write("Атака увеличена на 1.");
        afterSkillPoint();
      },
    },
    {
      label: "Защита",
      action: () => {
        hero.defense += 1;
        hero.skillPoints -= 1;
        write("Защита увеличена на 1.");
        afterSkillPoint();
      },
    },
  ]);
}

function afterSkillPoint() {
  storeSave();
  if (hero.skillPoints > 0) {
    spendSkillPoint();
    return;
  }
  afterSkillPointTarget();
}

function enterForest() {
  write(
    '<div class="entry-title">Локация 1 — Забытый лес</div>' +
      '<div class="entry-desc">Тёмный лес, в котором обитают первые опасные противники.</div>'
  );
  spawnEnemy();
}

function referenceHero(level) {
  const steps = level - 1;
  return {
    attack: 3 + steps,
    defense: 2 + steps,
    maxHealth: 7 + 3.2 * steps,
  };
}

function pickEnemyLevel(heroLevel) {
  const roll = Math.random();
  let offset;
  if (roll < 0.03) {
    offset = 6 + Math.floor(Math.random() * 5);
  } else if (roll < 0.22) {
    offset = 1 + Math.floor(Math.random() * 3);
  } else {
    offset = -2 + Math.floor(Math.random() * 4);
  }
  return Math.min(MAX_LEVEL, Math.max(1, heroLevel + offset));
}

function makeEnemy(heroLevel) {
  const kinds = ENEMY_KINDS.filter((kind) => kind.unlockLevel <= heroLevel);
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  const level = pickEnemyLevel(heroLevel);
  const reference = referenceHero(level);

  const defense = Math.round(reference.attack * kind.defenseShare);
  const hit = Math.max(1, reference.attack - defense);
  const health = Math.max(1, Math.round(hit * kind.hitsToKill));
  const bite = Math.max(1, Math.round(reference.maxHealth / kind.hitsYouSurvive));

  return {
    name: kind.name,
    description: kind.description,
    female: kind.female,
    level,
    health,
    maxHealth: health,
    damage: Math.round(reference.defense) + bite,
    defense,
    exp: Math.round((8 + 4 * kind.tier) * (1 + 0.5 * (level - 1))),
  };
}

function spawnEnemy() {
  enemy = makeEnemy(hero.level);
  lastHit = null;
  const warning =
    enemy.level >= hero.level + 5
      ? '<div class="warning">Он выглядит намного опаснее вас. Лучше сбежать.</div>'
      : "";
  write(
    `<div class="entry-title">${enemy.name}, уровень ${enemy.level}</div>` +
      `<div class="entry-desc">${enemy.description}</div>` +
      `<div class="stats">Здоровье: <b>${enemy.health}</b> · ` +
      `Урон: <b>${enemy.damage}</b> · Защита: <b>${enemy.defense}</b></div>` +
      bar(enemy.health, enemy.maxHealth) +
      warning,
    warning ? "entry-bad" : ""
  );
  combatMenu();
}

function combatMenu() {
  const options = [
    { label: "Атаковать", style: "primary", action: attack },
    {
      label: "Сбежать",
      action: () => {
        write("Ты покидаешь бой.");
        afterSkillPointTarget = characterMenu;
        characterMenu();
      },
    },
  ];
  if (lastHit) {
    options.push({
      label: "Информация об уроне",
      style: "ghost",
      action: () => showDamageInfo(combatMenu),
    });
  }
  ask("Выбери действие:", options);
}

function showDamageInfo(back) {
  const blockVerb = lastHit.female ? "заблокировала" : "заблокировал";
  const hitVerb = lastHit.female ? "нанесла" : "нанес";
  write(
    '<div class="entry-title">Информация об уроне</div>' +
      `<div class="entry-desc">Вы нанесли ${lastHit.heroAttack} урона, но ${lastHit.enemyName} ` +
      `${blockVerb} ${lastHit.enemyDefense} урона. Нанесено: ${lastHit.dealt}.<br>` +
      `${lastHit.enemyName} ${hitVerb} вам ${lastHit.enemyDamage} урона, но вы заблокировали ` +
      `${lastHit.heroDefense} урона. Получено: ${lastHit.received}.</div>`,
    "entry-info"
  );
  back();
}

function attack() {
  const dealt = Math.max(1, hero.attack - enemy.defense);
  enemy.health = Math.max(0, enemy.health - dealt);

  lastHit = {
    enemyName: enemy.name,
    female: enemy.female,
    heroAttack: hero.attack,
    enemyDefense: enemy.defense,
    dealt,
    enemyDamage: enemy.damage,
    heroDefense: hero.defense,
    received: 0,
  };

  write(
    `<div class="hit hit-you">Вы нанесли ${dealt} урона.</div>` +
      `<div class="entry-desc">${enemy.name}, уровень ${enemy.level}</div>` +
      bar(enemy.health, enemy.maxHealth),
    "entry-good"
  );

  if (enemy.health === 0) {
    victory();
    return;
  }

  const received = Math.max(1, enemy.damage - hero.defense);
  hero.health = Math.max(0, hero.health - received);
  lastHit.received = received;

  write(
    `<div class="hit hit-enemy">Вам нанесли ${received} урона.</div>` +
      `<div class="entry-desc">${escapeHtml(save.name)}</div>` +
      bar(hero.health, hero.maxHealth),
    "entry-bad"
  );
  storeSave();

  if (hero.health === 0) {
    death();
    return;
  }

  combatMenu();
}

function victory() {
  hero.wins += 1;
  hero.experience += enemy.exp;
  write(
    '<div class="entry-title">Победа</div>' +
      `<div class="entry-desc">Получено опыта: ${enemy.exp}</div>`,
    "entry-good"
  );

  let gained = 0;
  let needed = expNeeded(hero.level);
  while (hero.level < MAX_LEVEL && hero.experience >= needed) {
    hero.experience -= needed;
    hero.level += 1;
    hero.skillPoints += 1;
    hero.maxHealth += 3;
    hero.health += 3;
    hero.attack += 1;
    hero.defense += 1;
    gained += 1;
    needed = expNeeded(hero.level);
  }

  if (hero.level >= MAX_LEVEL) {
    hero.experience = 0;
  }

  if (gained > 0) {
    write(
      `<div class="entry-desc">Рост за уровни: здоровье +${gained * 3}, ` +
        `атака +${gained}, защита +${gained}</div>` +
        statsLine(hero),
      "entry-info"
    );
  }
  storeSave();

  afterSkillPointTarget = victoryMenu;
  if (hero.skillPoints > 0) {
    spendSkillPoint();
    return;
  }
  victoryMenu();
}

function victoryMenu() {
  const options = [
    { label: "Идти дальше", style: "primary", action: spawnEnemy },
    {
      label: "Сбежать",
      action: () => {
        afterSkillPointTarget = characterMenu;
        characterMenu();
      },
    },
  ];
  if (lastHit) {
    options.push({
      label: "Информация об уроне",
      style: "ghost",
      action: () => showDamageInfo(victoryMenu),
    });
  }
  ask("Выбери действие:", options);
}

function death() {
  write('<div class="entry-title">Вы умерли</div>', "entry-bad");
  storeSave();
  afterSkillPointTarget = deathMenu;
  if (hero.skillPoints > 0) {
    spendSkillPoint();
    return;
  }
  deathMenu();
}

function deathMenu() {
  ask("Выбери действие:", [
    {
      label: "Возродиться",
      style: "primary",
      action: () => {
        hero.health = hero.maxHealth;
        storeSave();
        write("Ты снова на ногах.");
        spawnEnemy();
      },
    },
    {
      label: "Вернуться в меню выбора класса",
      action: () => {
        storeSave();
        chooseClass();
      },
    },
    {
      label: "Информация об уроне",
      style: "ghost",
      action: () => showDamageInfo(deathMenu),
    },
  ]);
}

function start() {
  const loaded = loadSave();
  if (loaded && loaded.name) {
    save = loaded;
    write(`С возвращением, ${escapeHtml(save.name)}!`);
    mainMenu();
    return;
  }
  write("Добро пожаловать в текстовую игру!");
  askName();
}

start();
</script>
</body>
</html>
